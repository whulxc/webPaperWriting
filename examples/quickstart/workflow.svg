<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Evidence-linked bilingual revision with webPaperWriting</title>
  <desc id="description">A synthetic example follows three fixture rows from mean accuracy 0.74 to 0.78, resumes revision 002 with matching source hashes, and shows a localized bilingual Results sentence change. Feedback is simulated.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#edf4f8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#6a7e95"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #14263c; }
      .muted { fill: #566980; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .card { fill: #fff; stroke: #cfdae6; stroke-width: 1.5; }
      .heading { font-size: 21px; font-weight: 650; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#background)"/>
  <text x="48" y="58" font-size="18" font-weight="650" letter-spacing="0.4">webPaperWriting</text>
  <text x="48" y="104" font-size="35" font-weight="700">Resume the right revision. Change the right sentence.</text>
  <text x="48" y="136" class="body muted">A credential-free synthetic walkthrough, from evidence to a scoped bilingual diff.</text>

  <rect x="48" y="180" width="324" height="278" rx="16" class="card"/>
  <rect x="72" y="204" width="40" height="40" rx="10" fill="#eaf0ff"/>
  <path d="M84 214h16v20H84zm0 7h16m-10-7v20m-6-7h16" fill="none" stroke="#4769b5" stroke-width="1.5"/>
  <text x="126" y="231" class="heading">Read the evidence</text>
  <text x="72" y="280" class="small mono muted">materials/measurements.csv</text>
  <text x="72" y="319" class="body">3 synthetic fixture rows</text>
  <text x="72" y="360" font-size="32" font-weight="700">0.74</text>
  <path d="M164 349h38" stroke="#6a7e95" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="360" font-size="32" font-weight="700">0.78</text>
  <text x="72" y="391" class="small muted">Baseline mean</text>
  <text x="222" y="391" class="small muted">Candidate mean</text>
  <text x="72" y="428" class="body" font-weight="600">Gain of 4 percentage points</text>

  <path d="M383 316h30" stroke="#6a7e95" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="438" y="180" width="324" height="278" rx="16" class="card"/>
  <rect x="462" y="204" width="40" height="40" rx="10" fill="#e6f5ee"/>
  <path d="m472 225 6 6 13-15" fill="none" stroke="#23754f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="231" class="heading">Resume with context</text>
  <text x="462" y="280" class="small mono muted">PROJECT_STATE.json</text>
  <text x="462" y="323" font-size="27" font-weight="700" class="mono">rev-002</text>
  <rect x="462" y="344" width="145" height="31" rx="7" fill="#e8f5ee"/>
  <text x="474" y="365" class="small" style="fill:#256646">EN source · match</text>
  <rect x="462" y="384" width="145" height="31" rx="7" fill="#e8f5ee"/>
  <text x="474" y="405" class="small" style="fill:#256646">ZH source · match</text>
  <text x="622" y="368" class="small muted">SHA-256</text>
  <text x="622" y="391" class="small muted">recomputed</text>
  <text x="462" y="440" class="small muted">A fresh session reads the same state.</text>

  <path d="M773 316h30" stroke="#6a7e95" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="828" y="180" width="324" height="278" rx="16" class="card"/>
  <rect x="852" y="204" width="40" height="40" rx="10" fill="#fff2dc"/>
  <path d="m862 233 3-9 12-12 6 6-12 12-9 3zm11-17 6 6" fill="none" stroke="#93611d" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="906" y="231" class="heading">Inspect the revision</text>
  <text x="852" y="280" class="small mono muted">review/changes.diff</text>
  <text x="852" y="319" class="body" font-weight="650">Results sentence 2</text>
  <rect x="852" y="338" width="276" height="31" rx="7" fill="#fff0ee"/>
  <text x="865" y="359" class="small mono" style="fill:#9b3e35">− “improved accuracy by 4%”</text>
  <rect x="852" y="377" width="276" height="31" rx="7" fill="#e8f5ee"/>
  <text x="865" y="398" class="small mono" style="fill:#256646">+ “4 percentage points”</text>
  <text x="852" y="440" class="small muted">Same localized change in EN and ZH.</text>

  <rect x="48" y="490" width="1104" height="80" rx="14" fill="#14263c"/>
  <text x="72" y="522" class="small" style="fill:#c2d4e8">TRY THE EXAMPLE</text>
  <text x="72" y="550" font-size="18" class="mono" style="fill:#fff">paper-demo create --output-root /absolute/new/demo</text>
  <text x="1128" y="522" text-anchor="end" class="small" style="fill:#c2d4e8">Generated data · Simulated feedback</text>
  <text x="1128" y="550" text-anchor="end" class="small" style="fill:#c2d4e8">Read-only MCP walkthrough · No account required</text>
</svg>
