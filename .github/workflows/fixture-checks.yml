name: Packaged synthetic checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - run: python integrations/mcp/export_contracts.py --check
      - run: python -m pytest -q tests/test_demo.py tests/test_public_portability.py
      - run: paper-demo --help
