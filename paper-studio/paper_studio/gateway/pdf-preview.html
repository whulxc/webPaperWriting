<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双语论文预览</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color-scheme:light}body{margin:0;background:#f1f3f5;color:#202833}header{position:sticky;top:0;background:white;padding:12px;border-bottom:1px solid #ccd2d8;z-index:1}h1{font-size:1.1rem;margin:0}.identity{font-size:.8rem;color:#536170;overflow-wrap:anywhere}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}button,input{font:inherit;padding:5px 10px;border:1px solid #99a5b1;border-radius:5px;background:white}button{cursor:pointer}button[aria-pressed=true]{color:white;background:#264d70}button:disabled{opacity:.5;cursor:default}#page{width:3em}#status{margin:8px 0 0;font-size:.88rem}main{overflow:auto;padding:12px;text-align:center}canvas{background:white;box-shadow:0 2px 10px #0002;max-width:none}#empty{padding:3em 1em;color:#536170}
</style>
<header><h1>双语论文预览</h1><div id="identity" class="identity">正在核对当前项目…</div>
<div class="controls"><button id="zh" disabled>中文版 PDF</button><button id="en" disabled>英文版 PDF</button>
<button id="previous" disabled>上一页</button><input id="page" type="number" min="1" value="1" aria-label="页码" disabled><span id="pages">/ —</span><button id="next" disabled>下一页</button>
<button id="smaller" disabled aria-label="缩小">−</button><button id="larger" disabled aria-label="放大">＋</button></div>
<p id="status" role="status">等待宿主连接</p></header>
<main><div id="empty">从当前项目的已归档版本查看原始 PDF。</div><canvas id="pdf" hidden aria-label="PDF 页面"></canvas></main>
<script type="module">@@PDFJS_WORKER@@</script>
<script type="module">
@@PDFJS_MAIN@@
globalThis.paperPdfjs={getDocument};
</script>
<script type="module">
const pending=new Map();let sequence=0,origin="*",selection=null,documentPdf=null,loading=null,renderTask=null;
let language=null,pageNumber=1,zoom=1,busy=false,invalidated=false;
const buffers=new Map(),el=id=>document.getElementById(id),status=text=>{el("status").textContent=text;};
const localCMaps=@@PDFJS_CMAPS@@;
let assetFailure=null;
class LocalBinaryDataFactory{async fetch({kind,filename}){if(kind!=="cMapUrl"||!Object.hasOwn(localCMaps,filename)){assetFailure="此 PDF 需要未随当前预览器打包的字体映射";throw Error(assetFailure);}return Uint8Array.from(atob(localCMaps[filename]),x=>x.charCodeAt(0));}}
function request(method,params){return new Promise((resolve,reject)=>{const id=++sequence,timer=setTimeout(()=>{pending.delete(id);reject(Error("宿主响应超时，请重试"));},125000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:"2.0",id,method,params},origin);});}
function identity(value){return JSON.stringify([value.project_id,value.config_revision,value.manifest_sha256,value.version,value.preview_context,value.files]);}
function controls(){for(const id of ["zh","en"])el(id).disabled=busy||!selection||invalidated;for(const id of ["previous","next","page","smaller","larger"])el(id).disabled=busy||!documentPdf||invalidated;el("previous").disabled||=pageNumber<=1;el("next").disabled||=pageNumber>=documentPdf?.numPages;}
function clearView(){renderTask?.cancel();renderTask=null;el("pdf").hidden=true;el("pdf").width=0;el("pdf").height=0;el("empty").hidden=false;}
async function invalidate(){invalidated=true;buffers.clear();clearView();await loading?.destroy();loading=null;documentPdf=null;status("项目绑定或归档已变化，请关闭此侧栏后重新打开。");controls();}
async function current(){const reply=await request("tools/call",{name:"paper_pdf_preview",arguments:{}});if(reply.isError||reply.structuredContent?.schema!=="paper-studio.pdf-preview.v1")throw Error("当前项目未提供可用的预览入口");const value=reply.structuredContent;if(!value.files?.en||!value.files?.zh||!value.preview_context?.native_project)throw Error("预览缺少项目身份");if(selection&&identity(selection)!==identity(value)){await invalidate();throw Error("项目绑定或归档已变化，请重新打开侧栏");}selection??=value;el("identity").textContent=value.project_id+" · "+value.version+" · "+value.preview_context.native_project;return value;}
async function digest(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),x=>x.toString(16).padStart(2,"0")).join("");}
async function receive(lang,selected){const file=selected.files[lang];if(!Number.isSafeInteger(file.bytes)||file.bytes<1||file.bytes>64*1048576||file.pages>100)throw Error("PDF 超出预览预算");let entry=buffers.get(lang);if(!entry){entry={bytes:new Uint8Array(file.bytes),offset:0};buffers.set(lang,entry);}while(entry.offset<file.bytes){const offset=entry.offset,length=Math.min(262144,file.bytes-offset);const reply=await request("tools/call",{name:"paper_build_artifact",arguments:{project_id:selected.project_id,expected_config_revision:selected.config_revision,build_id:file.build_id,path:file.path,action:"chunk",offset,length}});if(reply.isError)throw Error("分片读取失败，可再次点击同一语言继续接收");const part=reply.structuredContent;if(!part||part.build_id!==file.build_id||part.path!==file.path||part.sha256!==file.sha256||part.bytes!==file.bytes||part.offset!==offset||typeof part.data_base64!=="string"||part.data_base64.length>4*Math.ceil(length/3))throw Error("分片身份不符");const bytes=Uint8Array.from(atob(part.data_base64),x=>x.charCodeAt(0));if(bytes.length!==length||await digest(bytes)!==part.chunk_sha256||part.next_offset!==(offset+length===file.bytes?null:offset+length))throw Error("分片校验失败，未显示未经核验的文件");entry.bytes.set(bytes,offset);entry.offset+=length;status("正在核验原始 PDF · "+Math.round(entry.offset/file.bytes*100)+"%");}if(await digest(entry.bytes)!==file.sha256){buffers.delete(lang);throw Error("原始 PDF 完整哈希不符");}return entry.bytes;}
async function render(){const selected=await current();if(!documentPdf||invalidated)return;const page=await documentPdf.getPage(pageNumber),base=page.getViewport({scale:1});const width=Math.max(320,Math.min(1600,document.documentElement.clientWidth-30));const scale=width/base.width*zoom,viewport=page.getViewport({scale});const ratio=Math.min(2,window.devicePixelRatio||1),canvas=el("pdf");canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=Math.floor(viewport.width)+"px";canvas.style.height=Math.floor(viewport.height)+"px";renderTask=page.render({canvasContext:canvas.getContext("2d"),viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]});await renderTask.promise;if(assetFailure)throw Error(assetFailure);renderTask=null;canvas.hidden=false;canvas.dataset.page=String(pageNumber);canvas.dataset.language=language;canvas.dataset.sha256=selected.files[language].sha256;el("empty").hidden=true;el("page").value=String(pageNumber);el("page").max=String(documentPdf.numPages);el("pages").textContent="/ "+documentPdf.numPages;status("原始 PDF 已核验 · "+(language==="zh"?"中文":"英文")+" · 第 "+pageNumber+" / "+documentPdf.numPages+" 页");}
async function run(action){if(busy||invalidated)return;busy=true;controls();try{await action();}catch(error){clearView();if(!invalidated)status(error.message);}finally{busy=false;controls();}}
async function open(lang){const selected=await current();clearView();if(loading){await loading.destroy();loading=null;documentPdf=null;}const bytes=await receive(lang,selected);await current();language=lang;pageNumber=1;zoom=1;assetFailure=null;loading=globalThis.paperPdfjs.getDocument({data:bytes.slice(),BinaryDataFactory:LocalBinaryDataFactory,isEvalSupported:false,useWorkerFetch:false,useWasm:false,disableFontFace:false,useSystemFonts:false,isImageDecoderSupported:false,isOffscreenCanvasSupported:false,disableWorkerRendering:true,stopAtErrors:true});documentPdf=await loading.promise;if(documentPdf.numPages!==selected.files[lang].pages)throw Error("原始 PDF 页数与归档不符");for(const id of ["zh","en"])el(id).setAttribute("aria-pressed",String(id===lang));await render();}
for(const lang of ["zh","en"])el(lang).onclick=()=>run(()=>open(lang));
el("previous").onclick=()=>run(async()=>{pageNumber--;await render();});el("next").onclick=()=>run(async()=>{pageNumber++;await render();});
el("page").onchange=()=>run(async()=>{const next=Number(el("page").value);if(!Number.isInteger(next)||next<1||next>documentPdf.numPages)throw Error("页码超出范围");pageNumber=next;await render();});
el("larger").onclick=()=>run(async()=>{zoom=Math.min(2,zoom+.25);await render();});el("smaller").onclick=()=>run(async()=>{zoom=Math.max(.5,zoom-.25);await render();});
window.addEventListener("message",event=>{if(event.source!==window.parent||(origin!=="*"&&event.origin!==origin))return;const msg=event.data;if(msg?.jsonrpc!=="2.0")return;if(pending.has(msg.id)){if(event.origin!=="null")origin=event.origin;const entry=pending.get(msg.id);pending.delete(msg.id);clearTimeout(entry.timer);if(msg.error)entry.reject(Error(msg.error.message));else entry.resolve(msg.result);}});
try{const initialized=await request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"paper-pdf-preview",version:"1.0.0"},appCapabilities:{}});if(!initialized.hostCapabilities?.serverTools)throw Error("当前宿主未提供侧栏工具桥接，无法读取项目 PDF");window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},origin);await current();status("请选择中文版 PDF 或英文版 PDF。");controls();}catch(error){status(error.message);}
</script></html>
